server:
  port: 18080

rule:
  engine:
    enabled: true
    default-chain-id: fireAlarm
    chain-config-path: fire-alarm-chain.json
    poll-size: 64
    pack-timeout-ms: 10000
    auto-start: true
    expression-engine: aviator
  designer:
    # 设计器保存的规则链落盘目录（相对工作目录），重启后自动恢复

logging:
  level:
    io.fire.rule: info
